<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geoportal - Unidades de Atención</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="css/styles.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <span class="mark"></span>
      <h1>GEOPORTAL&nbsp;-&nbsp;UNIDADES&nbsp;DE&nbsp;ATENCIÓN</h1>
      <span class="sub mono">levantamiento en campo · datos en vivo</span>
    </div>
    <div id="status-line">
      <span class="count"><b id="count-visible">–</b> / <span id="count-total">–</span> registros</span>
      <span id="last-update">actualizado —</span>
      <button id="ai-btn" title="Detectar posibles errores de ubicación">🤖 IA: anomalías</button>
      <button id="refresh-btn" title="Actualizar ahora">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        actualizar
      </button>
    </div>
  </div>

  <div id="sidebar">
    <div id="filters">
      <input type="text" id="search" placeholder="Buscar por UA, cantón, código…">
      <div class="filter-row">
        <select id="f-estado"><option value="">Estado: todos</option></select>
        <select id="f-provincia"><option value="">Provincia: todas</option></select>
      </div>
      <div class="filter-row">
        <select id="f-canton"><option value="">Cantón: elige una provincia primero</option></select>
      </div>
      <div class="filter-row">
        <select id="f-tipo"><option value="">Tipo: todos</option></select>
        <select id="f-servicio"><option value="">Servicio: todos</option></select>
      </div>
      <div class="legend">
        <span><span class="dot" style="background:var(--ok)"></span>Abierta</span>
        <span><span class="dot" style="background:var(--amber)"></span>Receso</span>
        <span><span class="dot" style="background:var(--alert)"></span>Cerrada</span>
        <span><span class="dot" style="background:var(--neutral)"></span>Otras</span>
      </div>
      <div class="export-row">
        <button id="export-filtered" class="export-btn">⬇ Excel (filtro actual)</button>
        <button id="export-all" class="export-btn export-btn-secondary">⬇ Excel (todo)</button>
      </div>
    </div>
    <div id="stats-scroll">
      <div id="zone-stats" class="stats-block">
        <div class="zs-title"><span>Totales por zona</span></div>
        <div class="zs-list" id="zs-list"></div>
      </div>
      <div id="province-stats" class="stats-block">
        <div class="zs-title"><span>Totales por provincia</span></div>
        <div class="zs-list" id="prov-stats-list"></div>
      </div>
      <div id="canton-stats" class="stats-block hidden">
        <div class="zs-title"><span id="canton-stats-title">Totales por cantón</span></div>
        <div class="zs-list" id="canton-stats-list"></div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bitacora-panel">
    <div id="list-header">Bitácora de puntos</div>
    <div id="record-list"></div>
  </div>

  <div id="selection-panel" class="floating-panel hidden">
    <div class="floating-panel-header">
      <span>Selección por polígono</span>
      <button class="floating-panel-close" onclick="clearSelection()">✕</button>
    </div>
    <div id="selection-body"></div>
  </div>

  <div id="anomaly-panel" class="floating-panel hidden">
    <div class="floating-panel-header">
      <span>🤖 Detector de anomalías (IA)</span>
      <button class="floating-panel-close" onclick="closeAnomalyPanel()">✕</button>
    </div>
    <div id="anomaly-body"></div>
  </div>
</div>

<!-- Orden de carga importante: cada archivo depende de que el anterior ya esté cargado -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/map-init.js"></script>
<script src="js/provinces-layer.js"></script>
<script src="js/cantons-layer.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/edit.js"></script>
<script src="js/export.js"></script>
<script src="js/geoprocess.js"></script>
<script src="js/ai-anomaly.js"></script>
<script src="js/main.js"></script>
</body>
</html>
